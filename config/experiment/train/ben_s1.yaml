# @package _global_
# Release specialist: experiments/train/bigearthnet-S1/version_16/checkpoints/epoch=9-step=37170.ckpt
# These are current training recipes; this reference does not certify historical preprocessing.
defaults:
  - override /model: multilabel_classification

data:
  _target_: eosfm.datamodules.BigEarthNetV2DataModule
  batch_size: 64
  num_workers: 12
  bands: 's1'
  root: data/bigearthnet

# Version 16 used VH,VV,VH-VV (training representation confirmed by Pierre).
normalization:
  mean: [-19.352570009935356,-12.643863201237926, -6.708706808697431]  # VH, VV, VH-VV
  std: [5.597965149305456, 5.141607088788221, 3.80422570350782]  # VH, VV, VH-VV

bands:
  - VH
  - VV
  - VH-VV

trainer:
  max_epochs: 10
  check_val_every_n_epoch: 1
  log_every_n_steps: 50

logger:
  name: bigearthnet-S1

model:
  model_args:
    backbone_pretrained: True
    backbone_in_chans: 3
    num_classes: 19
