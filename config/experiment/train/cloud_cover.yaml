# @package _global_
# Model settings checked against the 22-specialist source: experiments/train/cloud_cover/version_12/checkpoints/epoch=19-step=7340.ckpt
# These are current training recipes; this reference does not certify historical preprocessing.
defaults:
  - override /model: segmentation

data:
  _target_: eosfm.datamodules.CloudCoverDetectionDataModule
  batch_size: 32
  num_workers: 4
  # Dataset selection below already returns NIR, R, G in that order.
  band_indices: [0, 1, 2]
  root: data/cloud_cover
  download: true
  bands: ['B08', 'B04', 'B03']

normalization:
  mean: [3658.56637281, 2741.77336591, 2839.74661943]
  std: [2424.53102223, 2790.67891124, 2899.97362746]

bands:
  - B08
  - B04
  - B03

trainer:
  max_epochs: 20
  check_val_every_n_epoch: 1
  log_every_n_steps: 10

logger:
  name: cloud_cover

model:
  model_args:
    num_classes: 2
  loss: ce
