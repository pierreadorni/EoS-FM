# @package _global_
# Model settings checked against the 22-specialist source: experiments/train/inria_aerial/version_21/checkpoints/epoch=19-step=19380.ckpt
# These are current training recipes; this reference does not certify historical preprocessing.
defaults:
  - override /model: segmentation

data:
  _target_: eosfm.datamodules.InriaAerialDataModule
  batch_size: 16
  tile_size: 512
  stride: 512
  num_workers: 8
  pin_memory: true
  root: data

normalization:
  mean: [103.66568898, 109.08492642, 100.43484282]
  std: [51.23012484, 46.62307735, 44.84063043]

bands:
  - R
  - G
  - B


trainer:
  max_epochs: 20
  check_val_every_n_epoch: 1
  log_every_n_steps: 10

logger:
  name: inria_aerial

model:
  model_args:
    num_classes: 2
  loss: ce
