# @package _global_
# Model settings checked against the 22-specialist source: experiments/train/opencanopy/version_13/checkpoints/epoch=19-step=41480.ckpt
# These are current training recipes; this reference does not certify historical preprocessing.
defaults:
  - override /model: pixelwise_regression

data:
  _target_: eosfm.datamodules.OpenCanopyDataModule
  batch_size: 32
  num_workers: 16
  root_dir: data

normalization:
  mean: [107.81521068, 33.88587511, 40.71030802]
  std: [32.22845159, 26.66031499, 23.35656433]

bands:
  - IR
  - R
  - G

trainer:
  max_epochs: 20
  check_val_every_n_epoch: 1
  log_every_n_steps: 50

logger:
  name: opencanopy
