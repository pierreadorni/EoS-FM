# @package _global_
# Model settings checked against the 22-specialist source: experiments/train/sen12ms-rgb/version_6/checkpoints/epoch=19-step=40760.ckpt
# These are current training recipes; this reference does not certify historical preprocessing.
defaults:
  - override /model: segmentation

data:
  _target_: eosfm.datamodules.SEN12MSDataModule
  batch_size: 64
  num_workers: 4
  band_set: rgb
  pin_memory: true
  root: data/sen12ms

normalization:
  mean: [1144.86107596, 1138.98422028, 1219.08066453]
  std: [949.80079545, 710.99364792, 700.03174648]

bands:
  - B4
  - B3
  - B2

trainer:
  max_epochs: 20
  val_check_interval: 0.5

logger:
  name: sen12ms-rgb

model:
  model_args:
    num_classes: 11
