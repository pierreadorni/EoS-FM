_target_: eosfm.tasks.ChangeDetectionTask
model_factory: ChangeDetectionEncoderDecoderFactory
model_args:
  backbone: timm_convnextv2_atto
  backbone_pretrained: True
  decoder: UperNetDecoder
  # All dense specialists in the identified 22-entry source checkpoint use width 16.
  decoder_channels: 16
  head_channel_list: [16]
  head_dropout: 0.1
  num_classes: ???
loss: ce
ignore_index: -1
optimizer: AdamW
lr: 1.e-4
optimizer_hparams: {}
