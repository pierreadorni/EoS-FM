_target_: eosfm.tasks.PixelwiseRegressionTask
model_factory: EncoderDecoderFactory
model_args:
  backbone: timm_convnextv2_atto
  backbone_pretrained: True
  decoder: UperNetDecoder
  # All dense specialists in the identified 22-entry source checkpoint use width 16.
  decoder_channels: 16
  head_channel_list: [16]
  head_dropout: 0.1
loss: mse
ignore_index: -1
freeze_backbone: false
freeze_decoder: false
plot_on_val: 10  # Plot batch at index 10 (or set to True to plot batch 0)
optimizer: AdamW
lr: 1.e-4
optimizer_hparams: {}
