[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eosfm"
version = "0.1.0"
description = "EoS-FM package"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.6",
    "timm>=1.0",
]

[project.optional-dependencies]
training = [
    "terratorch",
    "hydra-core",
    "kornia",
    "codecarbon",
    "tensorboard",
]
# Only needed to read trusted, historical checkpoints. Release checkpoints use
# plain Python metadata and load safely without OmegaConf.
legacy = ["omegaconf"]

[tool.setuptools.packages.find]
include = ["eosfm*"]
exclude = ["notebooks*", "experiments*"]
